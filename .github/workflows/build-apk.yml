name: Build HTML Game APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Create Cordova Project
        run: |
          cordova create temp-project com.yourname.yourgame "YourGameName"
          cd temp-project
          cordova platform add android
      
      - name: Extract ZIP and Copy Game Files
        run: |
          rm -rf temp-project/www/*
          if [ -f game.zip ]; then
            unzip -o game.zip -d extracted-game/
            COUNT=$(ls -1 extracted-game/ | wc -l)
            if [ "$COUNT" -eq 1 ] && [ -d "extracted-game/$(ls extracted-game/)" ]; then
              FOLDER=$(ls extracted-game/)
              cp -r extracted-game/$FOLDER/* temp-project/www/
            else
              cp -r extracted-game/* temp-project/www/
            fi
            rm -rf extracted-game
          elif [ -d www ]; then
            cp -r www/* temp-project/www/
          else
            echo "ERROR: No game.zip or www folder found"
            exit 1
          fi
          ls -la temp-project/www/
      
      - name: Add App Icon
        run: |
          mkdir -p temp-project/res/icon/android
          if [ -f icon.png ]; then
            cp icon.png temp-project/res/icon/android/icon.png
          elif [ -f icon.jpg ]; then
            cp icon.jpg temp-project/res/icon/android/icon.png
          elif [ -f www/icon.png ]; then
            cp www/icon.png temp-project/res/icon/android/icon.png
          fi
      
      - name: Copy Config
        run: |
          if [ -f config.xml ]; then
            cp config.xml temp-project/config.xml
          fi
      
      - name: Build Debug APK
        run: |
          cd temp-project
          cordova build android
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: temp-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
