name: Build HTML Game APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Create Cordova Project
        run: |
          cordova create temp-project com.yourname.yourgame "YourGameName"
          cd temp-project
          cordova platform add android
      
      - name: Extract ZIP & Copy Game Files
        run: |
          # Step 1: Pehle Cordova ki default www clean karo
          echo "Cleaning default www folder..."
          rm -rf temp-project/www/*
          
          # Step 2: ZIP extract karo
          if [ -f "game.zip" ]; then
            echo "Found game.zip, extracting..."
            unzip -o game.zip -d extracted-game/
            
            # Step 3: Smart copy - agar single folder hai toh uske andar se nikalo
            if [ "$(ls -1 extracted-game/ | wc -l)" -eq 1 ] && [ -d "extracted-game/$(ls extracted-game/)" ]; then
              FOLDER_NAME=$(ls extracted-game/)
              echo "Single folder detected: $FOLDER_NAME"
              cp -r extracted-game/$FOLDER_NAME/* temp-project/www/
              cp -r extracted-game/$FOLDER_NAME/.* temp-project/www/ 2>/dev/null || true
            else
              echo "Direct files detected"
              cp -r extracted-game/* temp-project/www/
              cp -r extracted-game/.* temp-project/www/ 2>/dev/null || true
            fi
            
            rm -rf extracted-game
          else
            echo "No game.zip found, checking www folder..."
            if [ -d "www" ]; then
              cp -r www/* temp-project/www/
            else
              echo "ERROR: Neither game.zip nor www folder found!"
              exit 1
            fi
          fi
          
          echo "Files copied successfully!"
          ls -la temp-project/www/
      
      - name: Add App Icon
        run: |
          # Agar icon.png ya icon.jpg repo mein hai toh copy karo
          if [ -f "icon.png" ]; then
            echo "Found icon.png, copying to resources..."
            mkdir -p temp-project/res/icon/android
            cp icon.png temp-project/res/icon/android/icon.png
          elif [ -f "icon.jpg
